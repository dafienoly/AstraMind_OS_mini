<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
  <defs>
    <style>
      text { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #172129; }
      .mono { font-family: "IBM Plex Mono", monospace; }
      .muted { fill: #68747c; }
      .tiny { font-size: 12px; }
      .small { font-size: 14px; }
      .body { font-size: 17px; }
      .title { font-size: 24px; font-weight: 700; }
      .panel { fill: #fff; stroke: #cbd4d0; }
      .hair { stroke: #d5dcd9; stroke-width: 1; }
      text[fill="#fff"] { fill: #fff; }
      text[fill="#9a641d"] { fill: #9a641d; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2e5e84"/>
    </marker>
  </defs>
  <rect width="1600" height="780" fill="#f2f4f3"/>
  <text x="50" y="50" class="title">同一市场工作面，逐层缩小比较集合</text>
