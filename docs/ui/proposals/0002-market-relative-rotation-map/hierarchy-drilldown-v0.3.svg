    <text x="24" y="72" class="body" font-weight="700">历史有效成分 · 162/168</text>
    <rect x="24" y="96" width="195" height="156" fill="#f8faf9" stroke="#d5dcd9"/>
    <line x1="121" y1="112" x2="121" y2="236" class="hair"/>
    <line x1="40" y1="174" x2="203" y2="174" class="hair"/>
    <circle cx="148" cy="144" r="7" fill="#456f9b"/>
    <circle cx="88" cy="194" r="7" fill="#8b5b82"/>
    <circle cx="174" cy="202" r="7" fill="#4b8178"/>
    <text x="24" y="276" class="tiny muted">个股相对轮动 · 当前 L2 横截面</text>

    <rect x="238" y="96" width="188" height="156" fill="#fff" stroke="#d5dcd9"/>
    <text x="252" y="118" class="tiny muted">研究排序</text>
    <text x="252" y="146" class="tiny">1　合成证券甲　72.4</text>
    <text x="252" y="172" class="tiny">2　合成证券乙　68.9</text>
    <text x="252" y="198" class="tiny">3　合成证券丙　65.1</text>
    <text x="252" y="226" class="tiny muted">覆盖不足 6 只</text>

    <rect x="24" y="304" width="402" height="172" fill="#f8faf9" stroke="#d5dcd9"/>
    <polyline points="42,424 76,392 108,404 142,350 176,370 210,332 246,344 280,306 318,328 356,286 402,304"
              fill="none" stroke="#2e5e84" stroke-width="3"/>
    <line x1="42" y1="446" x2="404" y2="446" class="hair"/>
    <text x="38" y="328" class="tiny muted">统一蜡烛图检查器（日/周/月）</text>
    <text x="24" y="510" class="tiny mono muted">DataSnapshot / as_of / membership version 一致</text>
    <text x="24" y="532" class="tiny" fill="#9a641d">研究观察，不是个股推荐</text>
  </g>

  <text x="50" y="724" class="small muted">失败关闭：任一层缺少历史成员、行情、覆盖或公式身份时停在该层显示 blocked，不以当前成分、父级坐标或演示数据替代。</text>
  <text x="50" y="756" class="small muted">UI-PROP-0002 v0.3 · approved</text>
