    <text x="338" y="120" class="tiny muted">强势领先 ↑</text>
    <line x1="24" y1="154" x2="406" y2="154" class="hair"/>
    <path d="M50 420 C120 380 155 290 210 310 S300 210 350 180" fill="none" stroke="#456f9b" stroke-width="4"/>
    <circle cx="350" cy="180" r="10" fill="#fff" stroke="#456f9b" stroke-width="4"/>
    <text x="292" y="165" class="small">电子 · 加速</text>
    <text x="24" y="462" class="tiny muted">L1 基准：31 行业等权</text>
    <rect x="24" y="484" width="382" height="42" fill="#2e5e84"/>
    <text x="139" y="511" class="body" fill="#fff" font-weight="700">进入二级行业 →</text>
  </g>

  <line x1="500" y1="395" x2="550" y2="395" stroke="#2e5e84" stroke-width="3" marker-end="url(#arrow)"/>

