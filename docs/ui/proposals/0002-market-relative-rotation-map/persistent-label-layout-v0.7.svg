<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">
  <style>
    .cn{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#172129}
    .mono{font-family:"IBM Plex Mono",monospace;fill:#52616a}
    .title{font-size:28px;font-weight:750}.h2{font-size:18px;font-weight:700}
    .body{font-size:13px}.small{font-size:11px}.tiny{font-size:9px}
    .muted{fill:#68747c}.blue{fill:#2e5e84}.white{fill:#fff}
    .rule{stroke:#cbd5d0}.leader{fill:none;stroke:#879690;stroke-width:1}
    .node{fill:#fff;stroke-width:2}.label{fill:#fff;stroke:#c5cfca}
  </style>
  <rect width="1600" height="960" fill="#f2f4f3"/>
  <rect width="1600" height="94" fill="#fff"/>
  <text x="38" y="43" class="cn title">相对轮动 · 常驻名称布局</text>
  <text x="38" y="69" class="cn body muted">名称永不隐藏；位置密集时移动标签，不移动数据节点</text>
  <text x="1450" y="35" class="mono small blue">UI-PROP-0002</text>
  <text x="1472" y="57" class="mono small">v0.7 · DRAFT</text>

  <!-- compact -->
  <rect x="34" y="122" width="430" height="800" fill="#fff" stroke="#bdc9c3"/>
  <text x="56" y="154" class="cn small muted">紧凑态 · 350px 导航列</text>
  <text x="56" y="182" class="cn h2">名称常驻，尾迹聚焦</text>
  <text x="56" y="205" class="cn small muted">智能布局 · 12 / 12 个名称可见</text>
  <rect x="56" y="230" width="386" height="386" fill="#fff" stroke="#cbd5d0"/>
  <rect x="56" y="230" width="193" height="193" fill="#edf4f8"/>
  <rect x="249" y="230" width="193" height="193" fill="#faf7f0"/>
  <rect x="56" y="423" width="193" height="193" fill="#f4f7f6"/>
  <rect x="249" y="423" width="193" height="193" fill="#fbf6f2"/>
  <line x1="249" y1="230" x2="249" y2="616" class="rule"/>
  <line x1="56" y1="423" x2="442" y2="423" class="rule"/>
  <text x="68" y="250" class="cn tiny">弱势改善</text>
  <text x="360" y="250" class="cn tiny">强势领先</text>
  <text x="68" y="602" class="cn tiny">弱势落后</text>
  <text x="360" y="602" class="cn tiny">强势降温</text>

