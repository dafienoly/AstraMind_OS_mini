  <rect x="1074" y="440" width="96" height="28" class="label"/>
  <text x="1085" y="459" class="cn small">寒武纪-U</text>
  <path d="M870 602 L918 560 L976 520" fill="none" stroke="#2e5e84" stroke-width="4" stroke-dasharray="7 5"/>
  <circle cx="870" cy="602" r="10" fill="#fff" stroke="#2e5e84" stroke-width="4"/>
  <rect x="900" y="584" width="140" height="38" fill="#172129"/>
  <text x="911" y="600" class="cn small white" font-weight="700">中芯国际 · 加速上升</text>
  <text x="911" y="615" class="mono tiny white">X 105.42 · Y 107.18</text>
  <text x="606" y="817" class="cn tiny muted">左标签轨</text>
  <text x="1100" y="817" class="cn tiny muted">右标签轨</text>

  <!-- rules -->
  <rect x="1268" y="212" width="270" height="650" fill="#fff" stroke="#cbd5d0"/>
  <text x="1292" y="246" class="cn h2">常驻名称规则</text>
  <line x1="1292" y1="264" x2="1514" y2="264" class="rule"/>
  <text x="1292" y="294" class="mono small blue">01 · 永不隐藏</text>
  <text x="1292" y="318" class="cn small muted">筛选淡化名称，但不移除名称。</text>
  <text x="1292" y="359" class="mono small blue">02 · 只移动标签</text>
  <text x="1292" y="383" class="cn small muted">引导线起点始终是真实节点。</text>
  <text x="1292" y="424" class="mono small blue">03 · 稳定布局</text>
  <text x="1292" y="448" class="cn small muted">同一视口与日期得到同一位置，</text>
  <text x="1292" y="466" class="cn small muted">避免播放时标签随机跳动。</text>
  <text x="1292" y="507" class="mono small blue">04 · 选择优先</text>
  <text x="1292" y="531" class="cn small muted">选中名称深色、置顶并带指标；</text>
  <text x="1292" y="549" class="cn small muted">其他名称仍保持可读。</text>
  <text x="1292" y="590" class="mono small blue">05 · 高密度提示</text>
  <text x="1292" y="614" class="cn small muted">超过 16 个对象优先使用标签轨；</text>
  <text x="1292" y="632" class="cn small muted">超过 30 个建议展开，但不隐藏。</text>
  <line x1="1292" y1="668" x2="1514" y2="668" class="rule"/>
  <text x="1292" y="700" class="cn body" font-weight="700">移动端</text>
  <text x="1292" y="727" class="cn small muted">全宽画布；上下标签轨按象限分组。</text>
  <text x="1292" y="749" class="cn small muted">名称使用证券简称/行业标准简称，</text>
  <text x="1292" y="771" class="cn small muted">不截断为无法识别的代码。</text>
  <rect x="1292" y="798" width="222" height="38" fill="#edf4f8" stroke="#2e5e84"/>
  <text x="1304" y="822" class="cn small blue">节点准确 · 名称清楚 · 尾迹克制</text>
</svg>
