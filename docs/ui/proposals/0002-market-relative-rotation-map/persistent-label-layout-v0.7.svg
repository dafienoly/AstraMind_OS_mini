  <rect x="1074" y="360" width="96" height="28" class="label"/>
  <text x="1085" y="379" class="cn small">中微公司</text>
  <path d="M929 452 L1024 414 L1078 414" class="leader"/>
  <rect x="1074" y="400" width="96" height="28" class="label"/>
  <text x="1085" y="419" class="cn small">海光信息</text>
