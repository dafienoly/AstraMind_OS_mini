  <path d="M268 398 L292 380 L318 380" fill="none" stroke="#2e5e84" stroke-width="3" stroke-dasharray="5 4"/>
  <circle cx="268" cy="398" r="8" fill="#fff" stroke="#2e5e84" stroke-width="3"/>
  <rect x="315" y="367" width="91" height="28" fill="#172129"/>
  <text x="323" y="385" class="cn small white">中芯国际 · ↑◎</text>

  <text x="56" y="648" class="cn body" font-weight="700">布局优先级</text>
  <text x="56" y="674" class="cn small muted">① 节点旁八方向试放　② 同象限内错层</text>
  <text x="56" y="697" class="cn small muted">③ 进入左右标签轨，用细线连接真实位置</text>
  <line x1="56" y1="722" x2="442" y2="722" class="rule"/>
  <text x="56" y="752" class="cn body" font-weight="700">不被布局改变的事实</text>
  <text x="56" y="779" class="cn small muted">节点坐标、象限、尾迹末端、筛选与排序均不变。</text>
  <text x="56" y="805" class="cn small muted">选中对象使用深色标签；其他名称保持白底细边。</text>
  <rect x="56" y="840" width="386" height="50" fill="#fff9ef" stroke="#dec9a1"/>
  <text x="70" y="860" class="cn small" fill="#8b5e1b">对象较多时自动提示“已沿边排布”</text>
  <text x="70" y="879" class="cn tiny" fill="#8b5e1b">名称不会隐藏；展开聚焦可获得更准确的空间阅读。</text>

  <!-- focus -->
  <rect x="490" y="122" width="1076" height="800" fill="#fff" stroke="#bdc9c3"/>
  <text x="518" y="154" class="cn small muted">聚焦态 · 标签轨与真实节点分离</text>
  <text x="518" y="182" class="cn h2">空间关系保持准确，名称沿边有序落位</text>
  <rect x="518" y="212" width="728" height="650" fill="#fff" stroke="#cbd5d0"/>
  <rect x="518" y="212" width="364" height="325" fill="#edf4f8"/>
  <rect x="882" y="212" width="364" height="325" fill="#faf7f0"/>
  <rect x="518" y="537" width="364" height="325" fill="#f4f7f6"/>
  <rect x="882" y="537" width="364" height="325" fill="#fbf6f2"/>
  <line x1="882" y1="212" x2="882" y2="862" class="rule"/>
  <line x1="518" y1="537" x2="1246" y2="537" class="rule"/>
  <rect x="552" y="246" width="660" height="582" fill="none" stroke="#aab7b1" stroke-dasharray="4 5"/>
  <text x="538" y="238" class="cn small">弱势改善</text>
  <text x="1150" y="238" class="cn small">强势领先</text>
  <text x="538" y="846" class="cn small">弱势落后</text>
  <text x="1150" y="846" class="cn small">强势降温</text>

  <!-- focus cluster -->
  <circle cx="820" cy="442" r="6" class="node" stroke="#2e5e84"/>
  <circle cx="847" cy="459" r="6" class="node" stroke="#725aa5"/>
  <circle cx="866" cy="431" r="6" class="node" stroke="#238267"/>
