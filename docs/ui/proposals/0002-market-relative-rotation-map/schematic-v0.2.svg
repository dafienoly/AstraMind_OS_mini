    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2e5e84"/>
    </marker>
    <style>
      .cn { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; }
      .num { font-family: "IBM Plex Sans", "Noto Sans SC", sans-serif; font-variant-numeric: tabular-nums; }
      .mono { font-family: "IBM Plex Mono", monospace; }
      .title { fill:#172129; font-size:25px; font-weight:700; }
      .h2 { fill:#172129; font-size:18px; font-weight:700; }
      .body { fill:#46545d; font-size:14px; }
      .small { fill:#68747c; font-size:12px; }
      .tiny { fill:#7f8a91; font-size:10px; }
      .grid { stroke:#dfe6e3; stroke-width:1; stroke-dasharray:4 7; }
      .hair { stroke:#d6dfdc; stroke-width:1; }
      .track { fill:none; stroke:#7f9eae; stroke-width:2; opacity:.20; }
      .track-selected { fill:none; stroke:#2e5e84; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
      .formula { fill:#31434e; font-family:"IBM Plex Mono","Noto Sans SC",monospace; font-size:12px; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#e9eeec"/>
