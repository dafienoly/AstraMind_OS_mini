  <!-- formula drawer -->
  <rect x="1432" y="228" width="426" height="793" rx="12" fill="#f8faf9" stroke="#cbd7d4"/>
  <text x="1458" y="265" class="cn tiny">公式与口径</text>
  <text x="1458" y="293" class="cn h2">价格相对强弱，而非资金净流入</text>
  <line x1="1458" y1="312" x2="1832" y2="312" class="hair"/>
  <text x="1458" y="344" class="cn tiny">01 · 日收益与等权基准</text>
  <text x="1458" y="370" class="formula">rᵢ,ₜ = ln(Pᵢ,ₜ / Pᵢ,ₜ₋₁)</text>
  <text x="1458" y="393" class="formula">bₜ = mean(r₁,ₜ … r₃₁,ₜ)</text>
  <text x="1458" y="430" class="cn tiny">02 · 累计相对状态与趋势</text>
  <text x="1458" y="456" class="formula">Sᵢ,ₜ = Sᵢ,ₜ₋₁ + rᵢ,ₜ − bₜ</text>
  <text x="1458" y="479" class="formula">Tᵢ,ₜ = EMA₂₀(S) − EMA₆₀(S)</text>
  <text x="1458" y="516" class="cn tiny">03 · 五日动量</text>
  <text x="1458" y="542" class="formula">Mᵢ,ₜ = Tᵢ,ₜ − Tᵢ,ₜ₋₅</text>
  <text x="1458" y="579" class="cn tiny">04 · 每日横截面稳健标准化</text>
  <text x="1458" y="605" class="formula">z = (x − median) / (1.4826 × MAD)</text>
  <text x="1458" y="628" class="cn tiny">MAD 退化时使用总体标准差；仍为零则阻断</text>
  <text x="1458" y="665" class="cn tiny">05 · 可视坐标</text>
  <text x="1458" y="691" class="formula">X/Y = 100 + 5 × clip(z, −3, 3)</text>
  <rect x="1458" y="718" width="374" height="76" rx="8" fill="#fff8e9" stroke="#ead8ad"/>
  <text x="1475" y="742" class="cn small" fill="#76501c" font-weight="700">截断不等于实际值恰好为 85/115</text>
  <text x="1475" y="766" class="cn small" fill="#76501c">越界点保留 overflow 标记并在画布内显示。</text>
  <text x="1458" y="830" class="cn tiny">当前身份</text>
  <text x="1458" y="856" class="mono small">rotation-index-ew-v1.0.0</text>
  <text x="1458" y="879" class="cn small">SW2021:L1 · 31/31 · 输出 60 日</text>
  <line x1="1458" y1="906" x2="1832" y2="906" class="hair"/>
  <text x="1458" y="938" class="cn small">插值只改变屏幕位置，不写入快照或指标。</text>
  <rect x="1458" y="958" width="374" height="42" rx="8" fill="#172129"/>
  <text x="1580" y="984" class="cn small" fill="#fff" font-weight="700">关闭公式抽屉</text>
</svg>
