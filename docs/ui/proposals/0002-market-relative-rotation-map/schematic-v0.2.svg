  <path d="M350 590 C438 572 520 602 603 626 S760 674 856 640" class="track"/>
  <path d="M884 812 C924 739 914 661 880 600 S842 505 900 421" class="track"/>
  <path d="M675 778 C704 700 778 665 840 620 S932 514 986 433" class="track"/>
  <path d="M1140 794 C1080 744 1020 706 975 672 S900 612 822 590" class="track"/>
  <path d="M975 430 C1050 446 1117 432 1193 401 S1280 378 1334 382" class="track"/>
  <path d="M1328 520 C1265 562 1198 583 1145 628 S1055 718 1018 790" class="track"/>

  <!-- selected electronic track stays inside even at right edge -->
