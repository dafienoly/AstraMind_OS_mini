  <text x="240" y="843" class="cn small" fill="#527068">弱势落后</text>
  <text x="1269" y="843" class="cn small" fill="#95661e">强势降温</text>

  <!-- all tracks -->
  <path d="M280 730 C360 690 410 740 486 671 S610 580 655 530" class="track"/>
  <path d="M408 466 C480 520 558 490 620 448 S744 416 820 470" class="track"/>
  <path d="M1030 755 C970 706 992 642 1060 598 S1192 543 1275 468" class="track"/>
