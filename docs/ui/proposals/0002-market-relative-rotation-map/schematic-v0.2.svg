  <circle cx="846" cy="708" r="5" fill="#fff" stroke="#2e5e84" stroke-width="2"/>
  <circle cx="1034" cy="560" r="5" fill="#fff" stroke="#2e5e84" stroke-width="2"/>
  <circle cx="1240" cy="442" r="5" fill="#fff" stroke="#2e5e84" stroke-width="2"/>
  <rect x="1235" y="377" width="112" height="34" rx="7" fill="#172129"/>
  <circle cx="1253" cy="394" r="6" fill="#fff" stroke="#8dbbd5" stroke-width="2"/>
  <text x="1267" y="399" class="cn small" fill="#fff" font-weight="700">电子 · 截断</text>

  <!-- representative nodes -->
  <g fill="#fff" stroke-width="3">
    <circle cx="368" cy="458" r="7" stroke="#2e5e84"/><circle cx="506" cy="742" r="7" stroke="#238267"/>
    <circle cx="634" cy="540" r="7" stroke="#2e5e84"/><circle cx="910" cy="390" r="7" stroke="#c34b43"/>
