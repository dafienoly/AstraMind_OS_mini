  <!-- plot -->
  <rect x="174" y="308" width="1242" height="610" rx="12" fill="#fbfcfc" stroke="#d4ddda"/>
  <rect x="221" y="349" width="1146" height="515" rx="8" fill="#fff" stroke="#aebbc0" stroke-dasharray="6 5"/>
  <text x="229" y="340" class="cn tiny">安全绘图区：节点、标签、焦点环与轨迹均限制在内框</text>
  <rect x="222" y="350" width="572" height="257" fill="#edf5f7"/>
  <rect x="794" y="350" width="572" height="257" fill="#faefed"/>
  <rect x="222" y="607" width="572" height="256" fill="#f0f4f2"/>
  <rect x="794" y="607" width="572" height="256" fill="#fbf3e6"/>
