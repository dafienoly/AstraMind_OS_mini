<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <style>
      text { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #172129; }
      .mono { font-family: "IBM Plex Mono", monospace; }
      .muted { fill: #68747c; }
      .tiny { font-size: 12px; }
      .small { font-size: 14px; }
      .body { font-size: 16px; }
      .heading { font-size: 20px; font-weight: 700; }
      .hair { stroke: #d4dcda; stroke-width: 1; }
      .grid { stroke: #e7ece9; stroke-width: 1; }
      .chip { fill: #fff; stroke: #bdc8c3; }
      .active { fill: #2e5e84; stroke: #2e5e84; }
      .up { fill: #c34b43; }
      .down { fill: #238267; }
      text[fill="#fff"] { fill: #fff; }
      text[fill="#c34b43"] { fill: #c34b43; }
      text[fill="#238267"] { fill: #238267; }
      text[fill="#2e5e84"] { fill: #2e5e84; }
      text[fill="#9a641d"] { fill: #9a641d; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="#f2f4f3"/>
  <rect width="1600" height="58" fill="#fff"/>
  <text x="42" y="36" class="mono body" font-weight="700">ASTRAMIND / MINI</text>
  <text x="710" y="36" class="small muted">今日</text>
  <text x="780" y="36" class="small" font-weight="700">市场</text>
  <text x="852" y="36" class="small muted">策略竞技场</text>
  <text x="970" y="36" class="small muted">组合</text>
  <text x="1035" y="36" class="small muted">系统</text>
  <text x="1460" y="36" class="tiny muted">只读研究</text>

  <rect y="58" width="1600" height="38" fill="#fff" stroke="#d8dfdc"/>
  <text x="42" y="82" class="tiny" font-weight="700">数据</text>
  <text x="80" y="82" class="tiny muted">2026-07-28 完整</text>
  <text x="1380" y="82" class="tiny" fill="#9a641d">运动方向只表示相对动量，不是股价涨跌</text>

  <text x="40" y="130" class="small muted">市场 / 行业 / 相对轮动</text>
  <text x="1452" y="130" class="tiny muted">UI-PROP-0002 v0.5</text>

  <!-- Compact screener bar -->
  <rect x="40" y="150" width="1520" height="86" fill="#fff" stroke="#ccd5d1"/>
  <text x="58" y="176" class="tiny muted">筛选结果 8 / 31</text>
  <rect x="58" y="188" width="170" height="32" class="chip"/>
  <text x="72" y="209" class="tiny">象限：强势领先 ⌄</text>
  <rect x="236" y="188" width="190" height="32" class="active"/>
  <text x="250" y="209" class="tiny" fill="#fff">运动：加速上升 ⌄</text>
  <rect x="434" y="188" width="220" height="32" class="chip"/>
  <text x="448" y="209" class="tiny">排序：相对动量 Y ⌄</text>
  <rect x="662" y="188" width="116" height="32" class="chip"/>
  <text x="680" y="209" class="tiny">降序 ↓</text>
  <rect x="786" y="188" width="92" height="32" class="chip"/>
  <text x="806" y="209" class="tiny muted">重置</text>
  <text x="910" y="208" class="tiny muted">
    可选排序：X / Y / 运动速度 / 距中心 / 名称
  </text>

  <!-- Quadrant -->
  <rect x="40" y="250" width="1020" height="650" fill="#fff" stroke="#ccd5d1"/>
  <text x="62" y="280" class="heading">行业相对轮动</text>
  <text x="62" y="302" class="tiny muted">不匹配节点保留淡化；筛选不重取快照</text>
  <rect x="64" y="326" width="972" height="540" fill="#fbfcfb" stroke="#d4dcda"/>
  <line x1="550" y1="326" x2="550" y2="866" class="hair"/>
  <line x1="64" y1="596" x2="1036" y2="596" class="hair"/>
  <text x="80" y="350" class="small muted">弱势改善</text>
  <text x="928" y="350" class="small muted">强势领先</text>
  <text x="80" y="846" class="small muted">弱势落后</text>
  <text x="928" y="846" class="small muted">强势降温</text>
  <text x="930" y="888" class="tiny muted">相对趋势 X →</text>
  <text x="82" y="382" class="tiny muted">相对动量 Y ↑</text>

  <path d="M690 535 C730 510 775 469 828 410" fill="none" stroke="#c34b43"
    stroke-width="4"/>
  <circle cx="828" cy="410" r="10" fill="#fff" stroke="#c34b43" stroke-width="4"/>
  <rect x="842" y="391" width="150" height="30" fill="#172129"/>
  <text x="854" y="411" class="tiny" fill="#fff">电子 · 加速上升 ↑◎</text>

  <path d="M810 465 C835 448 852 439 861 433" fill="none" stroke="#b47a22"
    stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="861" cy="433" r="8" fill="#fff" stroke="#b47a22" stroke-width="3"/>
  <text x="874" y="438" class="tiny">通信 · 减速上升 ↑⋯</text>

  <path d="M725 415 C766 449 802 495 834 551" fill="none" stroke="#238267"
    stroke-width="4"/>
  <circle cx="834" cy="551" r="10" fill="#fff" stroke="#238267" stroke-width="4"/>
  <text x="848" y="556" class="tiny">煤炭 · 加速下跌 ↓◎</text>

  <path d="M650 435 C675 457 690 472 699 481" fill="none" stroke="#6d7e68"
    stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="699" cy="481" r="8" fill="#fff" stroke="#6d7e68" stroke-width="3"/>
  <text x="712" y="486" class="tiny">汽车 · 减速下跌 ↓⋯</text>

  <circle cx="405" cy="520" r="7" fill="#9ba6a1" opacity=".3"/>
  <circle cx="380" cy="690" r="7" fill="#9ba6a1" opacity=".3"/>
  <circle cx="910" cy="700" r="7" fill="#9ba6a1" opacity=".3"/>
  <text x="75" y="882" class="tiny muted">
    转强 / 转弱继续作为已确认结构事件，不再与速度状态混为一类
  </text>

  <!-- Sorted result list -->
  <rect x="1076" y="250" width="484" height="650" fill="#fff" stroke="#ccd5d1"/>
  <text x="1098" y="280" class="heading">分类结果</text>
  <text x="1098" y="303" class="tiny muted">强势领先 · 加速上升 · Y 降序</text>
  <line x1="1098" y1="322" x2="1538" y2="322" class="hair"/>
  <text x="1098" y="346" class="tiny muted">排名 / 对象</text>
  <text x="1320" y="346" class="tiny muted">坐标 X / Y</text>
  <text x="1480" y="346" class="tiny muted">状态</text>

  <rect x="1094" y="360" width="448" height="64" fill="#edf3f7" stroke="#2e5e84"/>
  <text x="1110" y="389" class="small" font-weight="700">01　电子</text>
  <text x="1320" y="389" class="tiny mono">108.42 / 112.80</text>
  <text x="1460" y="389" class="tiny" fill="#c34b43">↑◎ 加速上升</text>
  <text x="1138" y="409" class="tiny muted">速度 2.18 · 距中心 15.31</text>

  <rect x="1094" y="432" width="448" height="64" fill="#fff"/>
  <text x="1110" y="461" class="small">02　通信</text>
  <text x="1320" y="461" class="tiny mono">106.28 / 109.71</text>
  <text x="1460" y="461" class="tiny" fill="#c34b43">↑◎ 加速上升</text>
  <text x="1138" y="481" class="tiny muted">速度 1.76 · 距中心 11.56</text>

  <rect x="1094" y="504" width="448" height="64" fill="#fff"/>
  <text x="1110" y="533" class="small">03　计算机</text>
  <text x="1320" y="533" class="tiny mono">104.95 / 107.62</text>
  <text x="1460" y="533" class="tiny" fill="#c34b43">↑◎ 加速上升</text>
  <text x="1138" y="553" class="tiny muted">速度 1.21 · 距中心 9.08</text>

  <line x1="1098" y1="584" x2="1538" y2="584" class="hair"/>
  <text x="1098" y="612" class="small" font-weight="700">个股层使用同一控件</text>
  <text x="1098" y="637" class="tiny muted">筛选范围自动切换为当前 L2 有效成分</text>
  <rect x="1098" y="654" width="196" height="30" class="chip"/>
  <text x="1110" y="674" class="tiny">搜索名称 / 代码</text>
  <rect x="1302" y="654" width="112" height="30" class="chip"/>
  <text x="1315" y="674" class="tiny">象限 ⌄</text>
  <rect x="1422" y="654" width="116" height="30" class="chip"/>
  <text x="1434" y="674" class="tiny">运动 ⌄</text>
  <text x="1098" y="718" class="tiny muted">列表行至少显示：</text>
  <text x="1114" y="746" class="small">中芯国际　688981.SH</text>
  <text x="1114" y="770" class="tiny mono muted">X 107.32　Y 111.05　速度 1.42</text>
  <text x="1418" y="758" class="tiny" fill="#c34b43">↑◎ 加速上升</text>
  <text x="1098" y="818" class="tiny" fill="#9a641d">
    空结果显示“没有匹配对象”，不回退到全部对象
  </text>
  <text x="1098" y="846" class="tiny muted">
    筛选、排序写入 URL；选中对象不满足条件时仍保留检查器
  </text>

  <text x="40" y="940" class="tiny muted">
    示意数据仅用于确认信息层级；运动方向是相对动量轴变化，不代表证券绝对涨跌或交易信号。
  </text>
</svg>
