<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">UI-PROP-0011 v0.2 行业生命周期盘中临时移动</title><desc id="desc">行业完成日气泡保持原位，虚线连接按当前会话计算的临时S/L端点。</desc>
  <defs><style>
    .bg{fill:#F2F4F3}.paper{fill:#fff}.ink{fill:#172129}.muted{fill:#68747C}.blue{fill:#2E5E84}.ochre{fill:#B47A22}.line{stroke:#D8DEDC}.grid{stroke:#DDE5E2;stroke-dasharray:4 5}.move{stroke:#B47A22;stroke-width:2;stroke-dasharray:6 5}.sans{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}.num{font-family:"IBM Plex Sans","Segoe UI",sans-serif}.t10{font-size:10px}.t11{font-size:11px}.t12{font-size:12px}.t16{font-size:16px}.t22{font-size:22px}.bold{font-weight:700}
  </style></defs>
  <rect class="bg" width="1440" height="900"/><rect class="paper" x="30" y="24" width="1380" height="852"/>
  <text class="ink sans bold t22" x="62" y="64">行业生命周期 · 完成日坐标 + 盘中临时移动</text><text class="muted sans t11" x="62" y="87">当前价格只生成一个 provisional S/L 端点；阶段名称和完成日快照不被覆盖。</text>
  <rect x="62" y="105" width="1316" height="58" fill="#F8FAF9" stroke="#CAD4D1"/><text class="blue sans bold t12" x="84" y="130">CURRENT · 14:36:28</text><text class="muted sans t11" x="84" y="151">覆盖 30 / 31 行业　方法 lifecycle-intraday-overlay-v1.0.0　最后完成日 2026-07-28</text>
  <rect x="62" y="184" width="960" height="620" fill="#fff" stroke="#D8DEDC"/><rect x="1040" y="184" width="338" height="620" fill="#fff" stroke="#D8DEDC"/>
  <text class="ink sans bold t16" x="88" y="218">结构坐标</text><text class="muted sans t10" x="210" y="218">实心 = 完成日　空心虚线 = 盘中临时</text>
  <line class="grid" x1="152" y1="690" x2="950" y2="690"/><line class="grid" x1="152" y1="690" x2="152" y2="260"/>
  <text class="muted sans t10" x="520" y="730">强势参与率 S →</text><text class="muted sans t10" transform="translate(104 580) rotate(-90)">低位修复参与率 L →</text>
  <circle cx="610" cy="430" r="34" fill="#6D9FBD" fill-opacity=".78"/><text class="ink sans bold t11" x="590" y="434">电子</text><line class="move" x1="638" y1="410" x2="690" y2="366"/><circle cx="690" cy="366" r="36" fill="#fff" stroke="#B47A22" stroke-width="3"/><text class="ochre sans bold t11" x="673" y="370">盘中</text>
  <circle cx="390" cy="520" r="26" fill="#7FB5A4" fill-opacity=".78"/><text class="ink sans t10" x="372" y="524">医药</text><line class="move" x1="410" y1="506" x2="438" y2="482"/><circle cx="438" cy="482" r="27" fill="#fff" stroke="#B47A22" stroke-width="2"/>
  <circle cx="760" cy="570" r="30" fill="#C78268" fill-opacity=".78"/><text class="ink sans t10" x="744" y="574">煤炭</text><line class="move" x1="742" y1="548" x2="716" y2="520"/><circle cx="716" cy="520" r="31" fill="#fff" stroke="#B47A22" stroke-width="2"/>
  <circle cx="290" cy="360" r="24" fill="#968AA7" fill-opacity=".78"/><text class="ink sans t10" x="276" y="364">银行</text>
  <text class="ink sans bold t16" x="1064" y="220">电子</text><text class="muted sans t10" x="1064" y="248">完成日阶段</text><text class="ink sans bold t12" x="1210" y="248">强势扩散</text>
  <text class="muted sans t10" x="1064" y="278">完成日 S / L</text><text class="ink num bold t12" x="1210" y="278">68% / 42%</text><text class="muted sans t10" x="1064" y="306">盘中 S / L</text><text class="ochre num bold t12" x="1210" y="306">74% / 49%</text>
  <text class="muted sans t10" x="1064" y="334">临时位移</text><text class="ochre num bold t12" x="1210" y="334">↗ +9.2</text><text class="muted sans t10" x="1064" y="362">观察成分</text><text class="ink num bold t12" x="1210" y="362">438 / 452</text>
  <line class="line" x1="1064" y1="386" x2="1354" y2="386"/><text class="ink sans bold t12" x="1064" y="418">盘中解释</text><text class="muted sans t11" x="1064" y="446">强势参与增加，低位修复同步改善。</text><text class="muted sans t11" x="1064" y="472">这不是新的正式生命周期阶段。</text>
  <rect x="1064" y="510" width="290" height="112" fill="#F7F2E8"/><text class="ochre sans bold t11" x="1080" y="536">失败关闭</text><text class="muted sans t10" x="1080" y="560">覆盖不足的行业保留完成日气泡，</text><text class="muted sans t10" x="1080" y="580">但不绘制盘中端点；断线后所有</text><text class="muted sans t10" x="1080" y="600">空心端点标记为“非当前”。</text>
  <text class="blue sans bold t11" x="1064" y="674">显示盘中临时移动　●</text><text class="muted sans t10" x="1064" y="704">每秒替换端点，不留下秒级轨迹</text><text class="muted sans t10" x="1064" y="728">收盘封存后才可能形成新完成日气泡</text>
</svg>
