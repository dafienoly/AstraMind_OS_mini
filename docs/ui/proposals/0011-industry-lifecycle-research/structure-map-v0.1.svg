      .repair{fill:#7fb5a4}.expand{fill:#6d9fbd}.prosper{fill:#c6a15c}.cool{fill:#c78268}.recede{fill:#968aa7}
      .bubble{fill-opacity:.78;stroke:#fff;stroke-width:2}.label{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:10px;font-weight:700;fill:#172129;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
    </style>
  </defs>

