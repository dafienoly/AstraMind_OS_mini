<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">UI-PROP-0011 v0.1 行业生命周期结构地图</title>
  <desc id="desc">可解释的行业结构气泡地图，横轴为强势参与率，纵轴为低位修复参与率，右侧提供按生命周期阶段分组的行业索引。</desc>
